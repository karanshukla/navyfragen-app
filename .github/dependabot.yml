# Configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# This repo uses npm workspaces with a single root-level bun.lock (the installer
# was swapped from npm to bun — see issue #250). Dependabot's dedicated `bun`
# ecosystem updates bun.lock natively; the `npm` ecosystem does NOT update
# bun.lock correctly for workspaces (dependabot-core #14223), so this MUST stay
# on `bun` and point at the workspace root ("/") so the full workspace graph is
# resolved against the shared root lockfile.

version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      atproto:
        patterns:
          - "@atproto/*"
      atcute:
        patterns:
          - "@atcute/*"
      mantine:
        patterns:
          - "@mantine/*"
      oxlint:
        patterns:
          - "oxlint"

  - package-ecosystem: "docker"
    directory: "/anubis"
    schedule:
      interval: "weekly"

  # Without this block opengraph-service raises Go security *alerts* but never
  # opens update PRs, so every advisory needs a hand-written bump (see #348,
  # cel-go GHSA). Indigo is excluded because it is SHA-pinned on purpose —
  # hard constraint #8 in go.mod requires bumping it deliberately, and
  # dependabot would otherwise churn it to a new pseudo-version every week.
  - package-ecosystem: "gomod"
    directory: "/opengraph-service"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "github.com/bluesky-social/indigo"
