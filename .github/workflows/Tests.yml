name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  client-tests:
    name: Client Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Bun is the installer (issue #250 — package-manager swap only, not a
      # runtime swap). Node stays the runtime for vitest, so setup-node remains.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run client tests with coverage
        run: cd client && bun run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-coverage-report
          path: client/coverage/
          retention-days: 14

      - name: Report coverage on PR
        uses: davelosert/vitest-coverage-report-action@v2
        if: always() && github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: client

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2.3.6
        if: always()
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: client/coverage/lcov.info
          flag-name: client
          base-path: client
          parallel: true
          coverage-threshold-percent: 97

  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Installer swapped to bun (issue #250); runtime stays Node — this is the
      # production-truth baseline. The bun-runtime canary lives in its own job.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        # Native addons (better-sqlite3, sharp) need their build scripts; bun
        # blocks dep lifecycle scripts by default, so trust the ones we need.
        run: bun install --frozen-lockfile

      - name: Run server tests with coverage
        id: server-tests
        run: cd server && bun run test:coverage 2>&1 | tee /tmp/server-test-output.txt
        continue-on-error: true

      - name: Report coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/server-test-output.txt', 'utf8');

            // c8 text reporter outputs a table starting with a "---|---" separator line
            const coverageIdx = output.search(/^-+\|/m);
            if (coverageIdx === -1) {
              console.log('No coverage data found in output');
              console.log('--- last 800 chars ---');
              console.log(output.slice(-800));
              return;
            }

            const coverageText = output.slice(coverageIdx).trim();

            const marker = '<!-- server-coverage-comment -->';
            const body = `${marker}\n### Server Test Coverage\n\n\`\`\`\n${coverageText}\n\`\`\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2.3.6
        if: always()
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: server/coverage/lcov.info
          flag-name: server
          base-path: server
          parallel: true
          coverage-threshold-percent: 97

      - name: Fail if tests failed
        if: steps.server-tests.outcome == 'failure'
        run: exit 1

  # Bun-runtime gate for the server (issues #251/#263/#269). Two real checks:
  #   1. SQLite data layer probe (#263) — createDb → migrate → insert/select.
  #   2. The full server test suite under `bun test` (#269) — node:test's hooks
  #      plus the runtime-agnostic mock shim. Both gate the job; a regression in
  #      either fails it. (The suite was previously non-blocking/informational
  #      because Bun's runner didn't implement node:test's mock API; the shim in
  #      src/tests/mock-shim.ts resolved that.)
  server-tests-bun-runtime:
    name: Server Tests (Bun runtime canary)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Probe native/SDK deps + SQLite data layer under Bun runtime
        id: probe
        working-directory: server
        env:
          # createDb's SQLite branch pulls #/lib/env, which requires these at
          # load time. Mirror src/tests/test-bootstrap.js's dummy values.
          NODE_ENV: test
          OAUTH_TOKEN_SECRET: 0123456789abcdef0123456789abcdef
        run: |
          {
            echo "## Bun runtime canary — dependency probe"
            echo
            echo "Each line shows whether the module loads + exercises under Bun."
            echo
          } > "$GITHUB_STEP_SUMMARY"

          # SQLite data layer — the unblocked path from #263. The bun command
          # exits non-zero on any failure (mismatch or thrown error), and prints
          # "OK" on success. We gate on the exit code (authoritative) and also
          # confirm "OK" appeared, since the dotenv banner can prepend lines.
          set +e
          sqlite_out=$(bun -e "import('./src/database/db.ts').then(async ({createDb,migrateToLatest})=>{const db=await createDb(':memory:');await migrateToLatest(db);await db.insertInto('message').values({tid:'t1',message:'hi',createdAt:'2024-01-01',recipient:'did:web:x'}).execute();const row=await db.selectFrom('message').selectAll().executeTakeFirstOrThrow();await db.destroy();if(row.tid!=='t1')throw new Error('row mismatch '+JSON.stringify(row));console.log('OK',JSON.stringify(row))}).catch(e=>{console.error('FAIL',e.message);process.exit(1)})" 2>&1)
          sqlite_exit=$?
          set -e
          echo "$sqlite_out" | tee /dev/stderr >/dev/null
          {
            echo "<details><summary><code>bun-sqlite-data-layer</code> (acceptance #263)</summary>"
            echo ""
            echo '```'
            echo "$sqlite_out"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          # The remaining probes are informational; they don't gate the job.
          for spec in sharp web-push; do
            echo "<details><summary><code>${spec}</code></summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            if [ "$spec" = "sharp" ]; then
              bun -e "import('sharp').then(m=>console.log('OK sharp',m.default.versions.sharp)).catch(e=>{console.error('FAIL',e.message);process.exit(1)})" 2>&1 || true
            elif [ "$spec" = "web-push" ]; then
              bun -e "import('web-push').then(m=>console.log('OK web-push',typeof m.generateVAPIDKeys)).catch(e=>{console.error('FAIL',e.message);process.exit(1)})" 2>&1 || true
            fi
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          done

          # Gate the SQLite path. The bun command's exit code is authoritative
          # (non-zero means it threw or the row mismatched); the OK-string check
          # is a belt-and-suspenders confirmation. A regression here fails the
          # job, as does a suite failure in the bun-test step below.
          if [ "$sqlite_exit" -ne 0 ] || ! echo "$sqlite_out" | grep -q 'OK '; then
            echo "::error::SQLite data layer did not pass under Bun (regression of #263)"
            exit 1
          fi

      - name: Run server test suite under Bun runtime
        id: bun-tests
        working-directory: server
        run: |
          # The full server suite now runs green under Bun (#269). `bun test`
          # recognizes node:test's describe/test/before*/after* hooks; the
          # `mock` API comes from a runtime-agnostic shim (src/tests/mock-shim.ts)
          # that delegates mock.module/restoreAll to the host runner. Two Bun-
          # specific flags make it pass:
          #   --isolate      — fresh module registry per file, so a file's
          #                    mock.module (process-global + non-restorable under
          #                    Bun, unlike node:test's file-scoped mocks) can't
          #                    leak into other files.
          #   --no-env-file  — Bun auto-loads server/.env (real VAPID keys);
          #                   the suite expects test-bootstrap.js's dummy env.
          # The undici_v8 module-load crash (8.x CacheStorage throws under Bun)
          # is resolved by a patched @atproto-labs/fetch-node (see
          # patches/@atproto-labs%2Ffetch-node@0.3.5.patch + #270), so no test
          # preload is needed.
          bun test --isolate --no-env-file \
              --preload ./src/tests/test-bootstrap.js \
              src/tests/ \
              > /tmp/bun-runtime-test-output.txt 2>&1 || true
          {
            echo "<details><summary>Server test suite under Bun runtime</summary>"
            echo ""
            echo '```'
            tail -n 40 /tmp/bun-runtime-test-output.txt
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          # Gate: the suite must pass. `bun test` exits non-zero on any failure.
          if ! grep -q '0 fail' /tmp/bun-runtime-test-output.txt; then
            echo "::error::Server test suite failed under the Bun runtime (regression of #269)"
            exit 1
          fi

      - name: Upload canary output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bun-runtime-canary-output
          path: /tmp/bun-runtime-test-output.txt
          retention-days: 14
          if-no-files-found: ignore

  opengraph-tests:
    name: OpenGraph Service (Go) Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opengraph-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: opengraph-service/go.mod
          cache: true
          cache-dependency-path: opengraph-service/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Run tests
        # -race exercises the singleflight / cache-mutex / semaphore
        # concurrency surface that this change introduces. CGO is required for
        # the race detector; setup-go enables it by default on linux.
        run: go test -race -count=1 ./...

  html-to-image-tests:
    name: HTML-to-Image Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: html-to-image

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # html-to-image is deliberately outside the bun workspaces (it ships as a
      # standalone container), so it carries its own package-lock.json and
      # installs with npm rather than the root bun install.
      - name: Install dependencies
        # The tests never launch a browser — they drive createApp/createBrowserPool
        # through fakes — so the ~150MB Chrome download is pure CI cost. The
        # production image supplies Alpine's system Chromium instead.
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: node --test app.test.js

  coveralls-finish:
    name: Coveralls Finish
    needs: [client-tests, server-tests]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Finalize Coveralls build
        uses: coverallsapp/github-action@v2.3.6
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
          carryforward: "client,server"
          coverage-threshold-percent: 97
