name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  client-tests:
    name: Client Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Bun is the installer (issue #250) and the runtime for every client
      # script. Deliberately no setup-node: the runner image ships a Node
      # anyway, and `bun run <script>` hands node-shebang binaries (vite,
      # vitest, tsc) to it whenever it is on PATH, which is why every client
      # script routes through `bunx --bun`. The probe below asserts the runtime
      # rather than trusting that — a silent Node fallback would leave the whole
      # job measuring the wrong thing.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Probe Vite dev server under Bun
        working-directory: client
        run: |
          {
            echo "## Client Bun runtime probe"
            echo
          } > "$GITHUB_STEP_SUMMARY"

          # createServer + fetch of a TSX route through @vitejs/plugin-react.
          # `vite build` (the Docker path) and vitest (its own module runner)
          # both skip the dev server, so this is its only coverage.
          set +e
          probe_out=$(bun run probe:bun 2>&1)
          probe_exit=$?
          set -e
          echo "$probe_out" | tee /dev/stderr >/dev/null
          {
            echo "<details><summary><code>bun-vite-dev-server</code></summary>"
            echo ""
            echo '```'
            echo "$probe_out"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$probe_exit" -ne 0 ] || ! echo "$probe_out" | grep -q 'OK bun='; then
            echo "::error::Vite dev server did not pass under Bun"
            exit 1
          fi

      # tsc + vite build, the same pair docker/Dockerfile.client runs on the
      # oven/bun image.
      - name: Build under Bun
        run: cd client && bun run build

      - name: Run client tests with coverage
        run: cd client && bun run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-coverage-report
          path: client/coverage/
          retention-days: 14

      - name: Report coverage on PR
        uses: davelosert/vitest-coverage-report-action@v2
        if: always() && github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: client

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2.3.6
        if: always()
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: client/coverage/lcov.info
          flag-name: client
          base-path: client
          parallel: true
          coverage-threshold-percent: 97

  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Bun is both the installer (#250) and the server test runtime. The Node
      # `node --test` path and the runtime-agnostic mock shim were retired in
      # #288 — the suite now runs wholesale under `bun test`, and coverage comes
      # from Bun's built-in reporter (#287, configured in server/bunfig.toml).
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # Native addons (sharp) need their build scripts; bun blocks dep
        # lifecycle scripts by default, so trust the ones we need. (better-sqlite3
        # was removed in #288 — SQLite now runs through bun:sqlite, which ships
        # inside the Bun runtime and needs no native build.)
        run: bun install --frozen-lockfile

      # Runtime probes that guard Bun-specific regressions not covered by the
      # test suite itself. Both gate the job.
      - name: Probe SQLite data layer + OAuth handle resolution under Bun
        id: probe
        working-directory: server
        env:
          # createDb's SQLite branch pulls #/lib/env, which requires these at
          # load time. Mirror src/tests/test-bootstrap.js's dummy values.
          NODE_ENV: test
          OAUTH_TOKEN_SECRET: 0123456789abcdef0123456789abcdef
        run: |
          {
            echo "## Bun runtime probes"
            echo
          } > "$GITHUB_STEP_SUMMARY"

          # SQLite data layer — the bun:sqlite adapter bridged onto Kysely
          # (#263). The bun command exits non-zero on any failure (mismatch or
          # thrown error) and prints "OK" on success. Gate on the exit code
          # (authoritative) and confirm "OK" appeared (the dotenv banner can
          # prepend lines).
          set +e
          sqlite_out=$(bun -e "import('./src/database/db.ts').then(async ({createDb,migrateToLatest})=>{const db=await createDb(':memory:');await migrateToLatest(db);await db.insertInto('message').values({tid:'t1',message:'hi',createdAt:'2024-01-01',recipient:'did:web:x'}).execute();const row=await db.selectFrom('message').selectAll().executeTakeFirstOrThrow();await db.destroy();if(row.tid!=='t1')throw new Error('row mismatch '+JSON.stringify(row));console.log('OK',JSON.stringify(row))}).catch(e=>{console.error('FAIL',e.message);process.exit(1)})" 2>&1)
          sqlite_exit=$?
          set -e
          echo "$sqlite_out" | tee /dev/stderr >/dev/null
          {
            echo "<details><summary><code>bun-sqlite-data-layer</code> (#263)</summary>"
            echo ""
            echo '```'
            echo "$sqlite_out"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$sqlite_exit" -ne 0 ] || ! echo "$sqlite_out" | grep -q 'OK '; then
            echo "::error::SQLite data layer did not pass under Bun (regression of #263)"
            exit 1
          fi

          # OAuth handle resolution — the one production surface with no other CI
          # coverage. E2E signs in with an app password and never resolves a
          # handle, so this path (patched fetch-node → unicastFetchWrap) is only
          # exercised here. Its Bun failure mode is silent (resolution returns
          # undefined, surfacing only as "does not resolve to a DID"), so assert
          # a did: string comes back rather than trusting the call not to throw.
          set +e
          probe_out=$(bun -e "
            import { AtprotoHandleResolverNode } from '@atproto/oauth-client-node';
            const did = await new AtprotoHandleResolverNode({}).resolve('bsky.app');
            if (typeof did !== 'string' || !did.startsWith('did:')) {
              console.error('FAIL handle resolved to', JSON.stringify(did));
              process.exit(1);
            }
            console.log('OK oauth-handle-resolution bsky.app ->', did);
          " 2>&1)
          probe_exit=$?
          set -e
          echo "$probe_out"
          {
            echo "<details><summary><code>oauth-handle-resolution</code> (patched fetch-node, #270)</summary>"
            echo ""
            echo '```'
            echo "$probe_out"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$probe_exit" -ne 0 ]; then
            echo "::error::OAuth handle resolution failed under Bun — see bluesky-social/atproto#3511"
            exit 1
          fi

      - name: Run server tests with coverage
        id: server-tests
        run: cd server && bun run test:coverage 2>&1 | tee /tmp/server-test-output.txt
        continue-on-error: true

      - name: Report coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/server-test-output.txt', 'utf8');

            // Bun's text reporter outputs a table starting with a "---|---" separator
            // line, the same shape c8 produced — the regex is unchanged.
            const coverageIdx = output.search(/^-+\|/m);
            if (coverageIdx === -1) {
              console.log('No coverage data found in output');
              console.log('--- last 800 chars ---');
              console.log(output.slice(-800));
              return;
            }

            const coverageText = output.slice(coverageIdx).trim();

            const marker = '<!-- server-coverage-comment -->';
            const body = `${marker}\n### Server Test Coverage (bun:test — lines & functions; Bun reports no branch data)\n\n\`\`\`\n${coverageText}\n\`\`\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2.3.6
        if: always()
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: server/coverage/lcov.info
          flag-name: server
          base-path: server
          parallel: true
          # Bun's lcov carries line + function coverage only (no branch records),
          # so the server flag reports branch% as 0/N/A on Coveralls. The real
          # gate is Bun's own `coverageThreshold = 0.97` in bunfig.toml (which
          # fails the run below threshold); this Coveralls gate is a secondary
          # line-of-coverage defense and tolerates the missing branch metric.
          coverage-threshold-percent: 97

      - name: Fail if tests failed
        if: steps.server-tests.outcome == 'failure'
        run: exit 1


  opengraph-tests:
    name: OpenGraph Service (Go) Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opengraph-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: opengraph-service/go.mod
          cache: true
          cache-dependency-path: opengraph-service/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Run tests
        # -race exercises the singleflight / cache-mutex / semaphore
        # concurrency surface that this change introduces. CGO is required for
        # the race detector; setup-go enables it by default on linux.
        run: go test -race -count=1 ./...

  html-to-image-tests:
    name: HTML-to-Image Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: html-to-image

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # html-to-image is a bun workspace member (#314), so deps come from the
      # single root bun.lock — no standalone package-lock.json anymore.
      - name: Install dependencies
        # The unit tests never launch a browser — they drive
        # createApp/createBrowserPool through fakes — so the ~150MB Chrome
        # download is pure CI cost. The probe step below downloads it
        # explicitly only when it needs to launch one. The production image
        # supplies Alpine's system Chromium instead.
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: bun install --frozen-lockfile

      # Bun-runtime regression canary (#314). The service runs on Bun in
      # production; two surfaces in the render path are the load-bearing risk
      # under that runtime — the child_process.spawn of Chromium (Puppeteer
      # launches the browser via child_process) and the CDP WebSocket transport
      # between puppeteer and Chromium. This probe exercises both end-to-end
      # (launch → newPage → goto → evaluate → screenshot → close), mirroring
      # the server's SQLite/OAuth canaries. The probe needs a real Chromium,
      # so install the browser the resolved puppeteer expects here.
      - name: Probe Puppeteer under Bun
        id: probe
        env:
          PUPPETEER_SKIP_DOWNLOAD: "false"
        run: |
          # `bunx puppeteer browsers install chrome` downloads the build that
          # puppeteer.launch() with no executablePath picks up. bunx, not npx,
          # so this job needs no Node.
          bunx puppeteer browsers install chrome

          {
            echo "## Bun puppeteer probe"
            echo
          } > "$GITHUB_STEP_SUMMARY"

          # The probe lives in a checked-in file rather than a `bun -e` heredoc
          # so the JS isn't fighting bash's double-quote escaping (template
          # literals and ${} in particular). It imports CHROMIUM_LAUNCH_ARGS
          # from the real app so it exercises the actual launch flags.
          set +e
          probe_out=$(bun probe-bun-puppeteer.mjs 2>&1)
          probe_exit=$?
          set -e
          echo "$probe_out" | tee /dev/stderr >/dev/null
          {
            echo "<details><summary><code>bun-puppeteer-probe</code> (#314 regression canary)</summary>"
            echo ""
            echo '```'
            echo "$probe_out"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$probe_exit" -ne 0 ] || ! echo "$probe_out" | grep -q '^OK '; then
            echo "::error::Puppeteer did not pass under Bun (regression of #314)"
            exit 1
          fi

      - name: Run tests
        run: bun test app.test.js

  doc-links:
    name: Doc Links
    runs-on: ubuntu-latest

    # CLAUDE.md lets a test carry a business rule in place of a comment, on the
    # condition that the code links to that test. A renamed test breaks the link
    # silently, which puts the rule back to being undocumented.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The checker silently missed a wrapped @see once, so it is pinned by its
      # own boundary pairs before it is trusted to gate anything.
      - name: Test the checker
        run: bun run test:doc-links

      - name: Check doc links resolve
        run: bun run check:doc-links

  bot-policy:
    name: Anubis Bot Policy
    runs-on: ubuntu-latest

    # The policy allowed /site.webmanifest long after vite-plugin-pwa started
    # emitting /manifest.webmanifest, so the real file was challenged while the
    # rule sat there looking correct. Nothing caught it because nothing read the
    # policy and the client build together.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check the policy allows what the client ships
        run: bun run test:bot-policy

  coveralls-finish:
    name: Coveralls Finish
    needs: [client-tests, server-tests]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Finalize Coveralls build
        uses: coverallsapp/github-action@v2.3.6
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
          carryforward: "client,server"
          coverage-threshold-percent: 97
